# The uv workspace of the Python packages frc-core and frc. Each has its own
# pyproject.toml; this file only ties them together.

[tool.uv.workspace]
members = ["python/frc-core", "python/frc"]

[tool.uv]
# Resolve to versions with wheels on the platforms CI and most users run on
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.pytest.ini_options]
testpaths = ["python/frc-core/tests", "python/frc/tests"]
