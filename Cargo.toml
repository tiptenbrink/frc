[workspace]
members = ["rustfrc-python"]

[workspace.package]
version = "1.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/tiptenbrink/rustfrc"
authors = ["Tip ten Brink <tip@tenbrinkmeijs.com>"]

[package]
name = "rustfrc"
description = "An exact binomial split of images of counts, and Fourier ring correlation from one image or two."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["fourier-ring-correlation", "frc", "microscopy", "binomial", "resolution"]
categories = ["science", "mathematics", "multimedia::images"]
# The Python package's files and the bindings stay out of the crate.
include = ["/src", "/benches", "/LICENSE", "/README.md", "/CHANGELOG.md"]

[dependencies]
bytemuck = "1"
rand = { version = "0.10", default-features = false }
rand_xoshiro = "0.8"
rayon = "1.12.0"
rustfft = "6"

[target.'cfg(target_os = "linux")'.dependencies]
# madvise, for huge pages under the FRC spectrum.
libc = "0.2.191"

[dev-dependencies]
criterion = "0.8"
rand_distr = "0.6"

[[bench]]
name = "frc"
harness = false
