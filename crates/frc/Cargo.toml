[package]
name = "frc"
description = "Computes the Fourier ring correlation of two images, or of one image of counts that it splits in two with an exact binomial split."
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["fourier-ring-correlation", "frc", "microscopy", "binomial", "resolution"]
categories = ["science", "mathematics", "multimedia::images"]

[dependencies]
bytemuck = "1"
rayon = "1.12.0"
rustfft = "6"

[target.'cfg(target_os = "linux")'.dependencies]
# madvise, for huge pages under the FRC spectrum.
libc = "0.2.191"

[dev-dependencies]
criterion = "0.8"
rand = { version = "0.10", default-features = false }
rand_distr = "0.6"
rand_xoshiro = "0.8"

[[bench]]
name = "frc"
harness = false
