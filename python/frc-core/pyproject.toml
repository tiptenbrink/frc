[project]
name = "frc-core"
version = "0.2.0"
description = "The compiled core of frc, without dependencies: an exact binomial split and Fourier ring correlation for arrays that support the buffer protocol."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "Tip ten Brink", email = "tip@tenbrinkmeijs.com"},
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Image Processing"
]
# None: arrays come in through the buffer protocol and go out as memoryviews.
dependencies = []

[project.urls]
Source = "https://github.com/tiptenbrink/frc"

[dependency-groups]
dev = [
  "numpy >= 1.23.2",
  "pytest >= 9.0.3",
]

[tool.maturin]
# The bindings crate, which builds the crate frc into the module.
manifest-path = "../../crates/frc-python/Cargo.toml"
python-source = "python"
module-name = "frc_core._internal"

[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[tool.uv]
# Rebuild the extension module when the Rust code changes.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "../../Cargo.toml" },
  { file = "../../crates/**/Cargo.toml" },
  { file = "../../crates/**/*.rs" },
]
