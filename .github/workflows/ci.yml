name: CI
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --workspace --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # What a release to crates.io uploads must build on its own.
      - run: cargo package -p frc --locked

  python:
    name: Python ${{ matrix.py-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
          py-version: ['3.11', '3.12', '3.13', '3.14', '3.15', '3.15t']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.py-version }}
      # uv builds frc-core with maturin as part of installing the workspace.
      - name: uv sync
        run: uv sync --all-packages --locked
      - name: Pytest
        run: uv run --no-sync pytest

  python-oldest-numpy:
    name: Python 3.11 with the oldest NumPy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'
      - name: uv sync
        run: uv sync --all-packages --locked
      # The oldest NumPy that frc allows.
      - name: Install NumPy 1.23.2
        run: uv pip install numpy==1.23.2
      - name: Pytest
        run: uv run --no-sync pytest

  wheels:
    uses: ./.github/workflows/wheels.yml
    permissions:
      contents: read
