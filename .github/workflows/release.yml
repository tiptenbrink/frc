# The release of the crate frc to crates.io and of the Python packages
# frc-core and frc to PyPI, at one version, from examples/workspace-release.yml
# in touchgate, with the Python files built by wheels.yml. `touchgate approve`
# starts it with a signed approval, and the copies of this file and wheels.yml
# on `publish` run. crates.io and PyPI trust this file in the `release`
# environment. docs/RELEASING.md describes the setup.
name: release

on:
  workflow_dispatch:
    inputs:
      approval:
        description: The signed approval that `touchgate approve` sends
        required: true
        type: string

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # The public key that approves a release.
  TOUCHGATE_KEY: sk-ssh-ed25519@openssh.com AAAAGnNrLXNzaC1lZDI1NTE5QG9wZW5zc2guY29tAAAAIPK8VZox0UVPB1gsQowDPXlOj1Z34IIJ3V4I2chFNYONAAAAC3NzaDpzaWduaW5n release key
  # The uv that builds frc and uploads the Python packages. setup-uv checks it
  # against the checksum it knows for this version. frc builds with the copy
  # of uv_build in this uv, which `touchgate check --build` checks.
  UV_VERSION: 0.13.6

jobs:
  # Checks the approval before anything from the commit runs. touchgate is
  # installed before the checkout and reads the commit with git only.
  verify:
    name: Check the approval
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
    permissions:
      contents: read # to fetch the default branch
    steps:
      - uses: borink-org/touchgate/install@535fb730cb153a9453abff103fe2430e45af14c0 # v0.3.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      # touchgate reads the approval, the repository, the default branch and
      # the commit of this workflow from the run, and the key from
      # TOUCHGATE_KEY. It sets the output `commit` that the jobs below check
      # out.
      - id: verify
        run: touchgate verify

  # The commit is approved from here on, so reading and building it is safe.
  # Checks the version against the changelog, and that uv builds frc with its
  # own uv_build. It also packages the crate as crates.io would and builds
  # it, which runs the build scripts of its dependencies, in a job that cannot
  # get a token.
  check:
    name: Check the version and the crate
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out the release
    steps:
      - uses: borink-org/touchgate/install@535fb730cb153a9453abff103fe2430e45af14c0 # v0.3.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: touchgate check --build
      - run: cargo publish --workspace --locked --dry-run

  # Builds and tests the wheels and sdists of frc-core and frc in jobs that
  # cannot get a token. ci.yml builds them with the same workflow.
  build:
    name: Build
    needs: verify
    uses: ./.github/workflows/wheels.yml
    permissions:
      contents: read # to check out the release
    with:
      ref: ${{ needs.verify.outputs.commit }}

  # Publishes only once every check on the release commit has passed.
  checks:
    name: Wait for the release commit's checks
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      checks: read # to read the release commit's check runs
    steps:
      - uses: borink-org/touchgate/install@535fb730cb153a9453abff103fe2430e45af14c0 # v0.3.0
      - run: touchgate wait-for-checks
        env:
          GH_TOKEN: ${{ github.token }}

  # Compiles nothing. `--no-verify` packages the checked-out sources without
  # building them, and `cargo metadata` runs no build script.
  publish-crates:
    name: Publish to crates.io
    needs: [verify, check, build, checks]
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: touchgate-publish-crates
      cancel-in-progress: false
    permissions:
      contents: read # to check out the release
      id-token: write # for crates.io trusted publishing
    steps:
      - uses: borink-org/touchgate/install@535fb730cb153a9453abff103fe2430e45af14c0 # v0.3.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      # Skips what is on crates.io already, so a release that failed halfway
      # can run again.
      - run: touchgate publish --to crates.io --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Builds nothing from the commit. touchgate checks that the built files are
  # those of frc-core and frc at this version, signs their attestations and
  # uploads them, frc-core first.
  publish-pypi:
    name: Publish to PyPI
    needs: [verify, check, build, checks]
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: touchgate-publish-pypi
      cancel-in-progress: false
    permissions:
      contents: read # to check out the release
      id-token: write # for PyPI trusted publishing and the attestations
    steps:
      - uses: borink-org/touchgate/install@535fb730cb153a9453abff103fe2430e45af14c0 # v0.3.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: touchgate publish --to pypi dist

  # This job runs last, so a tag always names a published release.
  github-release:
    name: Tag and release on GitHub
    needs: [verify, publish-crates, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the tag and the release
    steps:
      - uses: borink-org/touchgate/install@535fb730cb153a9453abff103fe2430e45af14c0 # v0.3.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      # Attaches the approval to the release, as touchgate-approval.txt.
      - run: touchgate github-release dist/*
        env:
          GH_TOKEN: ${{ github.token }}
